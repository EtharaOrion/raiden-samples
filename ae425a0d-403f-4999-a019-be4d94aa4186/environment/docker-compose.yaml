services:
  kinesis:
    image: instructure/kinesalite@sha256:34400d82f28fa91b940a7c4afaf3a8ecdf47a0dd15625ebaa077d0ab28343581
    entrypoint: [""]
    command: ["node", "/usr/src/app/node_modules/kinesalite/cli.js", "--path", "/var/lib/kinesalite", "--port", "4567"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:4567/ || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 3s
  main:
    depends_on:
      kinesis:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL_KINESIS=http://kinesis:4567
      - AWS_ENDPOINT_URL=http://kinesis:4567
      - AWS_PAGER=
      - AWS_EC2_METADATA_DISABLED=true
    extra_hosts:
      - "pypi.org:0.0.0.0"
      - "pythonhosted.org:0.0.0.0"
      - "files.pythonhosted.org:0.0.0.0"
      - "github.com:0.0.0.0"
      - "githubusercontent.com:0.0.0.0"
      - "raw.githubusercontent.com:0.0.0.0"
      - "codeload.github.com:0.0.0.0"
      - "objects.githubusercontent.com:0.0.0.0"
      - "awscli.amazonaws.com:0.0.0.0"
      - "s3.amazonaws.com:0.0.0.0"
      - "dl.min.io:0.0.0.0"
      - "update.min.io:0.0.0.0"
      - "subnet.min.io:0.0.0.0"
      - "min.io:0.0.0.0"
      - "deb.debian.org:0.0.0.0"
      - "security.debian.org:0.0.0.0"
      - "archive.debian.org:0.0.0.0"
      - "ftp.debian.org:0.0.0.0"
      - "archive.ubuntu.com:0.0.0.0"
      - "security.ubuntu.com:0.0.0.0"
      - "ports.ubuntu.com:0.0.0.0"
      - "pypi.tuna.tsinghua.edu.cn:0.0.0.0"
      - "pypi.mirrors.ustc.edu.cn:0.0.0.0"
      - "mirrors.aliyun.com:0.0.0.0"
      - "mirrors.cloud.tencent.com:0.0.0.0"
      - "pypi.douban.com:0.0.0.0"
      - "mirrors.huaweicloud.com:0.0.0.0"
      - "repo.anaconda.com:0.0.0.0"
      - "conda.anaconda.org:0.0.0.0"
